plugins {
    id 'java'
}

group = 'io.github.takejohn'
version = '0.3.1'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'playpro'
        url = 'https://maven.playpro.com/'
    }
    maven {
        name = 'skript-repo'
        url = 'https://repo.skriptlang.org/releases'
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.128-stable'
    // Both are provided by the server at runtime; their own transitive dependencies are not needed to compile.
    compileOnly('net.coreprotect:coreprotect:23.2') {
        transitive = false
    }
    compileOnly('com.github.SkriptLang:Skript:2.16.2') {
        transitive = false
    }
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching(['plugin.yml', 'lang/*.lang']) {
        expand props
    }
}
